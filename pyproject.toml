[project]
name = "opensky"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Martin", email = "tmxmartin.ugarte@kof.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pandas>=3.1.1",
    "psycopg[binary]>=3.3.9",
    "requests>=2.34.2",
    "sqlalchemy>=2.1.8",
]

[project.scripts]
opensky = "opensky:main"
opensky-bronze = "opensky.bronze:main"
opensky-silver = "opensky.silver:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pandas-stubs>=3.1.0.261029",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
